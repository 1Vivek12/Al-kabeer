<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Al Kabeer Qatar</title>
    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <script src="js/auth.js"></script>
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <!-- Header Brand -->
            <div class="login-header">
                <img src="../static/images/alkabeer_logo.png" alt="Al Kabeer Logo" class="login-logo">
                <h2>Al Kabeer Admin Portal</h2>
                <p>Trading & Contracting W.L.L. - State of Qatar</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="login-form" autocomplete="off">
                <div id="loginAlert" class="login-alert" style="display: none;">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <span id="alertMessage">Invalid credentials provided.</span>
                </div>

                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <div class="input-icon-group">
                        <i class="bi bi-person-fill input-icon"></i>
                        <input type="text" id="username" class="form-control" placeholder="Enter username (e.g. admin)" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-icon-group">
                        <i class="bi bi-lock-fill input-icon"></i>
                        <input type="password" id="password" class="form-control" placeholder="Enter password" required>
                        <i class="bi bi-eye-slash-fill toggle-password" id="togglePassword" title="Show/Hide Password"></i>
                    </div>
                </div>

                <div class="login-options">
                    <label class="checkbox-container">
                        <input type="checkbox" id="rememberMe">
                        <span class="checkmark"></span>
                        Remember session on this device
                    </label>
                </div>

                <button type="submit" class="btn-primary btn-login">
                    <i class="bi bi-box-arrow-in-right"></i> Sign In to Dashboard
                </button>

                <div class="credentials-hint">
                    <i class="bi bi-info-circle-fill"></i> 
                    <strong>Default Login:</strong> Username: <code>admin</code> | Password: <code>alkabeer2026</code>
                </div>
            </form>

            <div class="login-footer">
                &copy; 2026 Al Kabeer Trading & Contracting W.L.L. All Rights Reserved.
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const rememberMeInput = document.getElementById('rememberMe');
            const loginAlert = document.getElementById('loginAlert');
            const alertMessage = document.getElementById('alertMessage');
            const togglePassword = document.getElementById('togglePassword');

            // Password Toggle Visibility
            togglePassword.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                togglePassword.classList.toggle('bi-eye-fill', isPassword);
                togglePassword.classList.toggle('bi-eye-slash-fill', !isPassword);
            });

            // Handle Login Submission
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                loginAlert.style.display = 'none';

                const username = usernameInput.value;
                const password = passwordInput.value;
                const remember = rememberMeInput.checked;

                const result = window.AdminAuth.login(username, password, remember);
                if (result.success) {
                    window.location.href = 'index.html';
                } else {
                    alertMessage.textContent = result.message;
                    loginAlert.style.display = 'flex';
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            });
        });
    </script>
</body>
</html>
